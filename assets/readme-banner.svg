<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="TG Media Downloader colorful animated banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="35%" stop-color="#7c3aed" />
      <stop offset="70%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="50%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ff4d6d" />
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="32" fill="url(#bg)" />

  <circle cx="1000" cy="90" r="110" fill="#ffffff" opacity="0.10">
    <animate attributeName="r" values="110;130;110" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="220" cy="250" r="80" fill="#ffffff" opacity="0.10">
    <animate attributeName="cy" values="250;220;250" dur="5s" repeatCount="indefinite" />
  </circle>
  <circle cx="930" cy="240" r="42" fill="#f472b6" opacity="0.22" />
  <circle cx="150" cy="90" r="30" fill="#fde68a" opacity="0.25" />

  <g filter="url(#softGlow)">
    <rect x="85" y="88" width="290" height="150" rx="26" fill="#0b1120" opacity="0.86" />
    <rect x="112" y="120" width="140" height="18" rx="9" fill="url(#accent)" />
    <rect x="112" y="152" width="205" height="12" rx="6" fill="#e2e8f0" opacity="0.8" />
    <rect x="112" y="176" width="168" height="12" rx="6" fill="#94a3b8" opacity="0.7" />
    <rect x="112" y="198" width="116" height="12" rx="6" fill="#38bdf8" opacity="0.8" />
  </g>

  <g>
    <text x="410" y="132" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="700">
      TG Media Downloader
      <animate attributeName="opacity" values="0.95;1;0.95" dur="3.5s" repeatCount="indefinite" />
    </text>
    <text x="410" y="172" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="24">
      Fast • Smart • Colorful Telegram media downloads
    </text>
  </g>

  <g transform="translate(410 205)">
    <rect width="290" height="44" rx="22" fill="url(#accent)" />
    <text x="145" y="27" fill="#111827" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" text-anchor="middle">
      Download with style
    </text>
    <animateTransform attributeName="transform" type="translate" values="410 205;410 198;410 205" dur="3s" repeatCount="indefinite" />
  </g>

  <g>
    <circle cx="1060" cy="70" r="6" fill="#fef3c7" opacity="0.9">
      <animate attributeName="cy" values="70;54;70" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="1090" cy="110" r="4" fill="#fde68a" opacity="0.9">
      <animate attributeName="cy" values="110;96;110" dur="2.2s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
